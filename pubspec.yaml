name: stub
description: Stub, a calm expense tracker with receipts, splits and budgets.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.0
  sqlite3: ^3.9.1
  path: ^1.9.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito_700Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito_800ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Nunito_900Black.ttf
          weight: 900
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono_400Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono_500Medium.ttf
          weight: 500
