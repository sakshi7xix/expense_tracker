name: CI
on:
  push:
    branches: ['**']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Render previews
        run: flutter test --update-goldens --run-skipped --tags golden
      - uses: actions/upload-artifact@v4
        with:
          name: previews
          path: test/golden/*.png
